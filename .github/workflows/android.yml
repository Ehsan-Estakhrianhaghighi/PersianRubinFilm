
name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PersianRubinFilm APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Step 3: Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Step 4: Install Android platform and build tools
      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Step 5: Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 6: Build debug APK
      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle."
            gradle assembleDebug --stacktrace
          fi

      # Step 7: Upload APK
      - name: Upload PersianRubinFilm APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PersianRubinFilm-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
